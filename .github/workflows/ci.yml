name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  classificador-cao-gato:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classificador-cao-gato
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - run: pytest

  descricao-de-imagens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: descricao-de-imagens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
